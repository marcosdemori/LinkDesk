name: Build LinkDesk Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build LinkDesk Windows Executables
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
      LIBCLANG_PATH: C:\Program Files\LLVM\bin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.x'
          cache: true

      - name: Setup LLVM / libclang
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Setup vcpkg and C++ codecs
        run: |
          vcpkg install opus:x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static aom:x64-windows-static
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Inject LinkDesk Oracle Cloud Configuration
        run: |
          $hostServer = if ("${{ secrets.SERVER_HOST }}") { "${{ secrets.SERVER_HOST }}" } else { "connect.linkdesk.io" }
          $pubKey = if ("${{ secrets.SERVER_PUBKEY }}") { "${{ secrets.SERVER_PUBKEY }}" } else { "" }
          python tools/configure_linkdesk.py "LinkDesk" $hostServer $pubKey

      - name: Compile LinkDesk Windows Executables
        run: |
          $hostServer = if ("${{ secrets.SERVER_HOST }}") { "${{ secrets.SERVER_HOST }}" } else { "connect.linkdesk.io" }
          $pubKey = if ("${{ secrets.SERVER_PUBKEY }}") { "${{ secrets.SERVER_PUBKEY }}" } else { "" }
          powershell -ExecutionPolicy Bypass -File build/build-windows.ps1 -ServerHost $hostServer -ServerPubKey $pubKey

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinkDesk-Windows-Binaries
          path: release/
