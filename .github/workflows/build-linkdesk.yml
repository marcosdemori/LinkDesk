name: Build LinkDesk Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build LinkDesk Windows Executables
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
      LIBCLANG_PATH: C:\Program Files\LLVM\bin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache vcpkg Dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-linkdesk-${{ hashFiles('build/build-windows.ps1') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-linkdesk-

      - name: Install C++ Codec Dependencies via vcpkg
        run: |
          vcpkg install opus:x64-windows-static libvpx:x64-windows-static libyuv:x64-windows-static aom:x64-windows-static

      - name: Generate Flutter Rust Bridge Bindings
        run: |
          cd client/flutter
          flutter pub get
          cd ../..
          Invoke-WebRequest -Uri "https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v1.80.1/flutter_rust_bridge_codegen-x86_64-pc-windows-msvc-v1.80.1.zip" -OutFile "$env:TEMP\frb.zip"
          Expand-Archive -Path "$env:TEMP\frb.zip" -DestinationPath "$env:TEMP\frb" -Force
          cd client
          & "$env:TEMP\frb\flutter_rust_bridge_codegen.exe" --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --skip-deps-check

      - name: Inject LinkDesk Oracle Cloud Configuration
        run: |
          $hostServer = if ("${{ secrets.SERVER_HOST }}") { "${{ secrets.SERVER_HOST }}" } else { "connect.linkdesk.io" }
          $pubKey = if ("${{ secrets.SERVER_PUBKEY }}") { "${{ secrets.SERVER_PUBKEY }}" } else { "" }
          python tools/configure_linkdesk.py "LinkDesk" $hostServer $pubKey

      - name: Compile LinkDesk Windows Executables
        run: |
          $hostServer = if ("${{ secrets.SERVER_HOST }}") { "${{ secrets.SERVER_HOST }}" } else { "connect.linkdesk.io" }
          $pubKey = if ("${{ secrets.SERVER_PUBKEY }}") { "${{ secrets.SERVER_PUBKEY }}" } else { "" }
          powershell -ExecutionPolicy Bypass -File build/build-windows.ps1 -ServerHost $hostServer -ServerPubKey $pubKey

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinkDesk-Windows-Binaries
          path: release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('LinkDesk {0}', github.ref_name) || 'LinkDesk v1.5.0' }}
          draft: false
          prerelease: false
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
